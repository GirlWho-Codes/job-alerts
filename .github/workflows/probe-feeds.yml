name: probe-feeds
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install feedparser
      - name: Show feed item structure
        run: |
          python3 - <<'PY'
          import feedparser
          for u in ["https://community.n8n.io/c/jobs.rss",
                    "https://nodesk.co/remote-jobs/index.xml",
                    "https://jobspresso.co/feed/?post_type=job_listing"]:
              d = feedparser.parse(u, agent="Mozilla/5.0 (job-alerts)")
              print("=== FEED", u, "entries:", len(d.entries))
              for e in d.entries[:3]:
                  keys = sorted(k for k in e.keys())
                  print("KEYS", keys)
                  print("TITLE", e.get("title"))
                  print("PUB", e.get("published"))
                  for k in keys:
                      if k not in ("title","summary","summary_detail","content","links","title_detail","published_parsed","updated_parsed"):
                          print("  ", k, "=", str(e.get(k))[:120])
                  print("SUMMARY", (e.get("summary") or "")[:300].replace("\n"," "))
                  print("-")
          PY
