name: probe-feeds
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate feeds
        run: |
          for u in \
            "https://community.n8n.io/c/jobs.json" \
            "https://community.n8n.io/c/jobs.rss" \
            "https://community.n8n.io/categories.json" \
            "https://remoteafrica.io/jobs/feed" \
            "https://remoteafrica.io/feed" \
            "https://remoteafrica.io/rss" \
            "https://dynamitejobs.com/rss" \
            "https://dynamitejobs.com/feed" \
            "https://remote.co/remote-jobs/feed/" \
            "https://remote.co/feed/" \
            "https://justremote.co/rss" \
            "https://justremote.co/remote-jobs.rss" \
            "https://www.workingnomads.com/jobsapi/_search" \
            "https://wellfound.com/jobs" \
            "https://www.storetasker.com/jobs" \
            "https://arc.dev/remote-jobs" ; do
            code=$(curl -s -L -A "Mozilla/5.0 (job-alerts probe)" -o /tmp/b -w '%{http_code} %{content_type}' --max-time 20 "$u")
            echo "=== $u -> $code"
            head -c 300 /tmp/b | tr '\n' ' '; echo
          done
